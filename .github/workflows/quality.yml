name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Content, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Test content snapshot checker
        run: npm run test:content
      - name: Check content snapshot before build
        run: npm run check:content
      - name: Test link checker
        run: npm run test:links
      - name: Lint
        run: npm run lint
      - name: Build pages and generate content
        run: npm run build
      - name: Check generated content is committed
        run: git diff --exit-code -- lib/generated-content.json
      - name: Check rendered internal links
        run: |
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3107 > /tmp/codex-study-club-next.log 2>&1 &
          link_server_pid=$!
          trap 'kill "$link_server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:3107/sitemap.xml > /dev/null; then
              break
            fi
            sleep 1
          done
          npm run check:links
